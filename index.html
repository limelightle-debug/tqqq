<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TQQQ</title>
<meta name="description" content="TQQQのチャート、月次騰落率の分布、保有年数別のリターン">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TQQQ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1114">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=LINE+Seed+JP:wght@400;700;800&display=swap">
<style>
:root{
  --bg:#0f1114; --panel:#171a1f; --ink:#eef0f2; --ink2:#b9bfc8; --muted:#848c97; --line:#2a2f37; --accent:#5ea4ff;
  --up:#2db069; --down:#ea4a51; --chip:#22262d; --shade:rgba(0,0,0,.35);
  --s-tqqq:#f07aa8; --s-qld:#4fb35c; --s-qqq:#9a7fd6; --s-hist:#f07aa8; --s-hist-neg:#a8456e;
  --f-tick:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"LINE Seed JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.num{font-family:var(--f-tick);font-stretch:82%;font-variant-numeric:tabular-nums}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:42px;height:42px;border-radius:10px;flex:none;box-shadow:0 0 0 1px var(--line)}
h1{margin:0;font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:26px;letter-spacing:.02em;line-height:1.1}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink2)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.open i{background:var(--up)}
.pill.warn{color:var(--down)}
.refresh{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:19px;line-height:1;cursor:pointer;flex:none}
.refresh.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--chip);border-radius:8px;padding:3px;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink2);font:500 13px/1 var(--f-body);padding:8px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px var(--shade);font-weight:700}
.seg.sm button{padding:7px 9px;font-size:12.5px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.price{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:14px}
.price .p{font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.price .p small{font-size:20px;font-weight:600;color:var(--ink2);margin-right:2px}
.price .chg{font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.pside{display:flex;flex-direction:column;gap:2px}
.dhl{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.dhl b{font-family:var(--f-tick);font-stretch:82%;font-size:15px;color:var(--ink);font-weight:700;margin-left:3px}
.price .meta{font-size:12px;color:var(--muted);width:100%}
.peers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.peer{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.peer .t{font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:15px;color:var(--ink2)}
.peer .v{font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.peer .c{font-family:var(--f-tick);font-stretch:82%;font-size:13px;font-variant-numeric:tabular-nums;width:100%}
.pos{color:var(--up)} .neg{color:var(--down)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;margin-top:12px}
.panel h2{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--ink2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.panel h2 span{font-weight:400;color:var(--muted);letter-spacing:0}
.tabctl{margin-top:14px}
.ctlrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.readout{font-size:12px;color:var(--ink2);min-height:18px;margin:6px 2px 2px;font-variant-numeric:tabular-nums}
#cread,#kread,#hread1,#hread2,#pread{height:40px;overflow:hidden}
.rrow{display:flex;gap:14px;white-space:nowrap;line-height:20px}
.dlist{margin-top:8px;font-size:12px;color:var(--ink2)}
.dlist .dhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dlist .dhead b{font-family:var(--f-tick);font-stretch:82%;font-size:14px;color:var(--ink)}
.dmonths{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:4px 10px;margin-top:6px}
.dmonths span{display:flex;justify-content:space-between;gap:6px;font-family:var(--f-tick);font-stretch:82%;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink);border-bottom:1px solid var(--line);padding:2px 0}
.dmonths i{font-style:normal;color:var(--muted)}
.readout b{font-family:var(--f-tick);font-stretch:82%;color:var(--ink);font-size:13px}
.chart{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ax{font-family:var(--f-tick);font-stretch:82%;font-size:11px;fill:var(--muted)}
.grid{stroke:var(--line);stroke-width:1}
.xh{stroke:var(--ink2);stroke-width:1;stroke-dasharray:3 3}
.fit{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:6 4;opacity:.8}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px}
.fact{background:var(--panel);padding:10px 12px;min-width:0}
.fact .l{font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.fact .v{font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.fact .s{font-size:11.5px;color:var(--ink2)}
.fact.wide{grid-column:1/-1}
#cfit,#kfacts{grid-template-columns:repeat(3,minmax(0,1fr))}
#dstats{grid-template-columns:repeat(4,minmax(0,1fr))}
#dstats .fact{padding:9px 8px}
#dstats .v{font-size:19px}
#dstats .s{font-size:10.5px;line-height:1.4}
#kfacts .v{font-size:20px}
td small{display:block;font-family:var(--f-body);font-stretch:100%;font-size:10.5px;color:var(--muted);font-weight:700}
.fact .v.eq{font-size:18px;white-space:normal}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:2px 2px 6px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.dash{background:none!important;border-top:2px dashed var(--ink);height:0}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--panel)}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--f-tick);font-stretch:82%;font-size:14px}
td.k{font-family:var(--f-body);font-stretch:100%;font-size:13px;color:var(--ink2)}
tr.hl td{background:var(--chip)}
.tscroll{overflow-x:auto}
.note{font-size:11.5px;color:var(--muted);margin:8px 2px 0;line-height:1.7}
.eq{font-family:var(--f-tick);font-stretch:90%;font-size:13px;color:var(--ink)}
.empty{padding:50px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.foot{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.7}
.foot a{color:var(--accent)}
.foot.lab{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.labname{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.06em}
.labname img{width:36px;height:36px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px var(--line)}
@media (max-width:420px){.price .p{font-size:40px}.seg button{padding:8px 9px;font-size:12.5px}}
@media (prefers-reduced-motion:reduce){.refresh.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="titlerow">
      <div class="brand">
        <img class="avatar" src="icons/avatar.png" alt="" width="42" height="42">
        <div style="min-width:0">
          <h1>TQQQ</h1>
          <div class="status" id="status">読み込み中…</div>
        </div>
      </div>
      <button type="button" class="refresh" id="refresh" aria-label="最新データに更新">↻</button>
    </div>
    <div class="controls">
      <div class="seg" id="tabs" role="group" aria-label="表示">
        <button type="button" data-tab="chart">チャート</button>
        <button type="button" data-tab="dist">分布</button>
        <button type="button" data-tab="hold">リターン</button>
      </div>
    </div>
  </div>

  <div id="app" hidden>
    <div class="price" id="price"></div>
    <div class="peers" id="peers"></div>

    <!-- tab 1: price chart -->
    <section id="t-chart">
      <div class="ctlrow">
        <div class="seg" id="tf" role="group" aria-label="足">
          <button type="button" data-tf="d">日足</button>
          <button type="button" data-tf="w">週足</button>
          <button type="button" data-tf="m">月足</button>
        </div>
        <div class="seg" id="scale" role="group" aria-label="目盛り">
          <button type="button" data-sc="lin">通常</button>
          <button type="button" data-sc="log">対数</button>
        </div>
      </div>
      <div class="ctlrow"><div class="seg sm" id="range" role="group" aria-label="期間"></div></div>
      <div class="panel">
        <div class="readout" id="cread"></div>
        <div class="chart" id="cchart"></div>
      </div>
      <div class="facts" id="cfit"></div>
      <div class="panel">
        <h2>騰落率の比較 <span>終値・期間の始まりを0%</span></h2>
        <div class="legend" id="pleg"></div>
        <div class="readout" id="pread"></div>
        <div class="chart" id="pchart"></div>
      </div>
    </section>

    <!-- tab 2: monthly return distribution -->
    <section id="t-dist" hidden>
      <div class="facts" id="dstats"></div>
      <div class="panel">
        <h2>月次騰落率の分布</h2>
        <div class="chart" id="dchart"></div>
        <div class="dlist" id="dread"></div>
      </div>
      <div class="panel">
        <h2>幾何平均から計算したリターン倍率 <span id="msub"></span></h2>
        <div class="tscroll"><table id="mtable"></table></div>
      </div>
      <div class="panel">
        <h2>ケリー基準 <span id="ksub"></span></h2>
        <div class="facts" id="kfacts" style="margin-top:0"></div>
        <h2 style="margin-top:14px">実効露出と成長率</h2>
        <div class="tscroll"><table id="ktable"></table></div>
        <div class="readout" id="kread" style="margin-top:10px"></div>
        <div class="chart" id="kchart"></div>
      </div>
    </section>

    <!-- tab 3: holding period -->
    <section id="t-hold" hidden>
      <div class="ctlrow">
        <div class="seg" id="hmode" role="group" aria-label="計算方法">
          <button type="button" data-hm="lh">年安値 → 年高値</button>
          <button type="button" data-hm="ee">年末 → 年末</button>
        </div>
      </div>
      <div class="panel">
        <h2>平均倍率 <span id="hsub1"></span></h2>
        <div class="legend" id="hleg1"></div>
        <div class="readout" id="hread1"></div>
        <div class="chart" id="hchart1"></div>
      </div>
      <div class="panel">
        <h2>年率（CAGR） <span>倍率から計算</span></h2>
        <div class="legend" id="hleg2"></div>
        <div class="readout" id="hread2"></div>
        <div class="chart" id="hchart2"></div>
      </div>
      <div class="panel">
        <h2>データ：平均倍率 <span id="hsub3"></span></h2>
        <div class="tscroll"><table id="htable1"></table></div>
      </div>
      <div class="panel">
        <h2>データ：年率（CAGR）</h2>
        <div class="tscroll"><table id="htable2"></table></div>
      </div>
    </section>

    <div class="foot lab"><span class="labname"><img src="icons/lab.jpg" alt="" width="36" height="36">恐怖指数研究所</span><a href="https://limelightle-debug.github.io/ndx-heatmap/">Nasdaq 100 を開く</a></div>
  </div>
  <div class="empty" id="empty">データを読み込んでいます…</div>
</div>

<script src="d3.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem("tqqq."+k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem("tqqq."+k,v)}catch(e){}}};
const RANGES={d:[["3M","3ヶ月",63],["6M","6ヶ月",126],["1Y","1年",252],["2Y","2年",504]],w:[["1Y","1年",52],["2Y","2年",104],["5Y","5年",260],["ALL","全期間",0]],m:[["5Y","5年",60],["10Y","10年",120],["ALL","全期間",0]]};
const DEF_RANGE={d:"6M",w:"2Y",m:"ALL"};
const state={tab:store.get("tab","chart"),tf:store.get("tf","d"),sc:store.get("sc","lin"),range:{d:store.get("r_d",DEF_RANGE.d),w:store.get("r_w",DEF_RANGE.w),m:store.get("r_m",DEF_RANGE.m)},hm:store.get("hm","lh"),ci:null,di:null,hi:null,ki:null,pi:null};
if(!["chart","dist","hold"].includes(state.tab))state.tab="chart";
if(!RANGES[state.tf])state.tf="d";
let D=null, DAYS=[], C={};

/* ---------- data ---------- */
const ymd=n=>{const s=String(n);return`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`};
function setData(d){
  D=d;
  DAYS=d.daily.map(([n,o,h,l,c,a,qc,lc])=>({n,d:ymd(n),t:Date.UTC(+String(n).slice(0,4),+String(n).slice(4,6)-1,+String(n).slice(6,8)),o,h,l,c,a,qc:qc??null,lc:lc??null}));
}
function bars(tf){
  if(tf==="d")return DAYS;
  const out=[];let cur=null,key=null;
  DAYS.forEach(x=>{
    let k;
    if(tf==="m")k=x.d.slice(0,7);
    else{const dt=new Date(x.t);const wd=(dt.getUTCDay()+6)%7;k=new Date(x.t-wd*864e5).toISOString().slice(0,10)}
    if(k!==key){cur={d:x.d,k,t:x.t,o:x.o,h:x.h,l:x.l,c:x.c,a:x.a,qc:x.qc,lc:x.lc,last:x.d};out.push(cur);key=k}
    else{cur.h=Math.max(cur.h,x.h);cur.l=Math.min(cur.l,x.l);cur.c=x.c;cur.a=x.a;if(x.qc!=null)cur.qc=x.qc;if(x.lc!=null)cur.lc=x.lc;cur.last=x.d;cur.t2=x.t}
  });
  return out;
}
// least squares on ln(y) = ln(a) + b·x
function expFit(xs,ys){
  const n=xs.length;if(n<3)return null;
  let sx=0,sy=0,sxx=0,sxy=0;for(let i=0;i<n;i++){const y=Math.log(ys[i]);sx+=xs[i];sy+=y;sxx+=xs[i]*xs[i];sxy+=xs[i]*y}
  const b=(n*sxy-sx*sy)/(n*sxx-sx*sx), la=(sy-b*sx)/n;
  let ssr=0,sst=0;const my=sy/n;for(let i=0;i<n;i++){const y=Math.log(ys[i]),f=la+b*xs[i];ssr+=(y-f)**2;sst+=(y-my)**2}
  return{a:Math.exp(la),b,r2:sst?1-ssr/sst:1,f:x=>Math.exp(la+b*x)};
}

/* ---------- formatting ---------- */
const pct=(v,d=1)=>v==null||!isFinite(v)?"—":(v>0?"+":v<0?"−":"±")+Math.abs(v*100).toFixed(d)+"%";
const pctAbs=(v,d=1)=>v==null||!isFinite(v)?"—":(v<0?"−":"")+Math.abs(v*100).toFixed(d)+"%";
const mult=v=>v==null||!isFinite(v)?"—":(v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2))+"倍";
const px=v=>v==null?"—":v>=100?v.toFixed(1):v>=1?v.toFixed(2):v.toFixed(3);
const cls=v=>v>0?"pos":v<0?"neg":"";
function readColors(){const cs=getComputedStyle(document.documentElement);const g=n=>cs.getPropertyValue(n).trim();C={up:g("--up"),down:g("--down"),ink:g("--ink"),muted:g("--muted"),tqqq:g("--s-tqqq"),qld:g("--s-qld"),qqq:g("--s-qqq"),hist:g("--s-hist"),histNeg:g("--s-hist-neg"),chip:g("--chip")}}

/* ---------- market status ---------- */
function nyParts(date){const f=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",hour:"numeric",minute:"numeric",hour12:false}).formatToParts(date);const o={};f.forEach(p=>o[p.type]=p.value);return{wd:o.weekday,min:(+o.hour%24)*60+(+o.minute)}}
function marketOpen(date=new Date()){const p=nyParts(date);return !["Sat","Sun"].includes(p.wd)&&p.min>=570&&p.min<960}
function renderStatus(){
  if(!D)return;
  const d=new Date(D.updatedAt);
  const t=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit"}).format(d);
  const open=marketOpen();const age=(Date.now()-d.getTime())/6e4;const stale=open?age>45:age>4*1440;
  $("status").innerHTML=`<span>更新 ${esc(t)}</span><span class="pill ${open?"open":""}"><i></i>${open?"米国市場 取引中":"米国市場 時間外"}</span>${stale?`<span class="pill warn">更新が遅れています</span>`:""}`;
}
function renderPrice(){
  const last=DAYS[DAYS.length-1];const qt=(D.quotes&&D.quotes.TQQQ)||{};
  const p=qt.price||last.c;const prev={c:qt.prev||DAYS[DAYS.length-2].c};const ch=p/prev.c-1;
  // live while the quote carries a time of day in the regular session (today's bar is built from it)
  const md=x=>`${+x.slice(5,7)}/${+x.slice(8,10)}`;
  const live=/\d:\d/.test(qt.time||"")&&!/closed/i.test(qt.time||"");
  const when=live?"最新値":`${md(last.d)}の終値`;
  let ath=0;DAYS.forEach(x=>{if(x.h>ath)ath=x.h});
  // day's high and low: from the live quote while the market is open, otherwise the last daily bar
  // (the last bar is today's while live, so its high and low are a fallback for the same day)

/* ---------- Kelly ---------- */
// Expected log growth per month with a fraction f of capital in TQQQ, rebalanced monthly, over the historical months.
const kGrowth=(rs,f)=>{let s=0;for(const r of rs){const x=1+f*r;if(x<=0)return -Infinity;s+=Math.log(x)}return s/rs.length};
const LEV=3; // TQQQ: 3x Nasdaq-100
function renderKelly(rs){
  const n=rs.length, wins=rs.filter(r=>r>0), loss=rs.filter(r=>r<=0);
  const p=wins.length/n, aw=d3.mean(wins)||0, al=-(d3.mean(loss)||0), worst=d3.min(rs);
  // allocation from 0% upward in 0.01% steps; the optimum is where expected log growth peaks
  let best=0,bg=-Infinity;
  for(let k=0;k<=100000;k++){const f=k/10000,g=kGrowth(rs,f);if(!isFinite(g))break;if(g>bg){bg=g;best=f}}
  const ann=f=>Math.exp(12*kGrowth(rs,f))-1, half=best/2, x=v=>(v*LEV).toFixed(2)+"倍";
  $("ksub").textContent=`${rs.length}ヶ月`;
  $("kfacts").innerHTML=`<div class="fact"><div class="l">勝率</div><div class="v">${(p*100).toFixed(2)}%</div><div class="s">${wins.length} / ${n}ヶ月</div></div>
   <div class="fact"><div class="l">平均勝ち幅</div><div class="v pos">${(aw*100).toFixed(2)}%</div></div>
   <div class="fact"><div class="l">平均負け幅</div><div class="v neg">${(al*100).toFixed(2)}%</div></div>
   <div class="fact"><div class="l">ケリー最適</div><div class="v">${(best*100).toFixed(1)}%</div><div class="s">対Nasdaq100 ${x(best)}</div></div>
   <div class="fact"><div class="l">ハーフケリー</div><div class="v">${(half*100).toFixed(1)}%</div><div class="s">対Nasdaq100 ${x(half)}</div></div>
   <div class="fact"><div class="l">TQQQ最悪の月</div><div class="v neg">${(worst*100).toFixed(1)}%</div></div>`;
  const rows=[[.5,""],[2/3,""],[half,"ハーフケリー"],[1,""],[best,"ケリー最適"]].sort((a,b)=>a[0]-b[0]);
  $("ktable").innerHTML=`<thead><tr><th>対Nasdaq100</th><th>TQQQ比率</th><th>年率成長</th><th>最悪の月</th></tr></thead><tbody>${rows.map(([f,l])=>`<tr${l?' class="hl"':""}><td>${x(f)}${l?`<small>${l}</small>`:""}</td><td>${(f*100).toFixed(1)}%</td><td>${pct(ann(f))}</td><td>${pct(f*worst)}</td></tr>`).join("")}</tbody>`;
  // curve: growth against Nasdaq-100 exposure
  const el=$("kchart");const W=Math.max(300,el.clientWidth), H=Math.round(Math.min(300,W*.68));
  const ML=44,MR=10,MT=10,MB=26, PW=W-ML-MR, PH=H-MT-MB;
  const fmax=Math.min(best*1.6,1/Math.abs(worst)-.005);
  const pts=[];for(let f=0;f<=fmax+1e-9;f+=fmax/200){const g=kGrowth(rs,f);if(isFinite(g))pts.push([f,Math.exp(12*g)-1])}
  const X=d3.scaleLinear().domain([0,fmax*LEV]).range([ML,ML+PW]);
  const Y=d3.scaleLinear().domain([Math.min(0,d3.min(pts,q=>q[1])),d3.max(pts,q=>q[1])]).nice().range([MT+PH,MT]);
  let g="";Y.ticks(5).forEach(v=>{g+=`<line class="grid" x1="${ML}" x2="${ML+PW}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${ML-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v*100)}%</text>`});
  X.ticks(6).forEach(v=>{g+=`<text class="ax" x="${X(v)}" y="${H-8}" text-anchor="middle">${v}倍</text>`});
  const line=`<path d="${pts.map((q,i)=>(i?"L":"M")+X(q[0]*LEV).toFixed(1)+" "+Y(q[1]).toFixed(1)).join("")}" fill="none" stroke="${C.tqqq}" stroke-width="2.2"/>`;
  // reference marks: thin solid pink lines (selection uses the common white dashes); labels sit on the side away from the neighbouring mark
  const mark=(f,lab,ty,left)=>{const xx=X(f*LEV);return`<line x1="${xx}" x2="${xx}" y1="${MT}" y2="${MT+PH}" stroke="${C.tqqq}" stroke-width="1.5" opacity=".45"/><circle cx="${xx}" cy="${Y(ann(f))}" r="4" fill="${C.tqqq}" stroke="var(--panel)" stroke-width="1.5"/><text class="ax" x="${left?xx-5:xx+5}" y="${ty}" text-anchor="${left?"end":"start"}" style="fill:var(--ink2);font-weight:700">${lab}</text>`};
  const show3=Math.abs(best-1)>.05&&Math.abs(half-1)>.05;
  let mk=mark(half,"ハーフ",MT+10,half<1)+mark(best,"ケリー",MT+10,best<1&&half>=1);if(show3)mk+=mark(1,"3倍",MT+PH-6,false);
  // the selected position: the same white dashes as every other chart
  const sel=state.ki;let xh="";if(sel!=null&&pts[sel]){const sx=X(pts[sel][0]*LEV);xh=`<line class="xh" x1="${sx}" x2="${sx}" y1="${MT}" y2="${MT+PH}"/><circle cx="${sx}" cy="${Y(pts[sel][1])}" r="4.5" fill="${C.ink}" stroke="var(--panel)" stroke-width="1.5"/>`}
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="実効露出と年率成長">${g}${line}${mk}${xh}<rect class="hit" x="${ML}" y="${MT}" width="${PW}" height="${PH}" fill="transparent"/></svg>`;
  el._geo={ML,PW,n:pts.length,step:true};
  const q=sel!=null&&pts[sel]?pts[sel]:[best,ann(best)];
  const nw=t=>`<span style="white-space:nowrap">${t}</span>`;
  $("kread").innerHTML=[nw(`対Nasdaq100 <b>${x(q[0])}</b>（TQQQ ${(q[0]*100).toFixed(1)}%）`),nw(`年率成長 <b>${pct(q[1])}</b>`),nw(`最悪の月 <b>${pct(q[0]*worst)}</b>`)].join("　");
}

/* ---------- tab 3: holding period ---------- */
const SYMS=[["QQQ","qqq"],["QLD","qld"],["TQQQ","tqqq"]];
function holdStats(mode){
  const out={};
  SYMS.forEach(([s])=>{
    const Y=D.years[s];const thisYear=new Date().getFullYear();
    const years=Object.keys(Y).map(Number).filter(y=>y<thisYear);
    const res=[];
    for(let n=1;n<=10;n++){let sum=0,cnt=0;
      years.forEach(y=>{const e=Y[y+n];if(!e||y+n>=thisYear)return;
        if(mode==="lh"){if(!Y[y].full)return;sum+=e.hi/Y[y].lo;cnt++}
        else{sum+=e.end/Y[y].end;cnt++}});
      const m=cnt?sum/cnt:null;res.push({n,m,cnt,cagr:m?m**(1/n)-1:null})}
    const first=years.find(y=>mode==="ee"||Y[y].full);
    out[s]={res,first,last:Math.max(...years)};
  });
  const t=out.TQQQ.res.filter(r=>r.m);out.fit=expFit(t.map(r=>r.n),t.map(r=>r.m));
  return out;
}
function lineChart(el,read,{xs,series,yfmt,ylab,sel}){
  const W=Math.max(300,el.clientWidth), H=Math.round(Math.min(340,W*.75));
  const ML=44,MR=44,MT=10,MB=26, PW=W-ML-MR, PH=H-MT-MB;
  const vals=series.flatMap(s=>s.vals.filter(v=>v!=null&&isFinite(v)));
  const y=d3.scaleLinear().domain([Math.min(0,d3.min(vals)),d3.max(vals)]).nice().range([MT+PH,MT]);
  const x=i=>ML+(i/(xs.length-1))*PW;
  let g="";y.ticks(5).forEach(v=>{g+=`<line class="grid" x1="${ML}" x2="${ML+PW}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${ML-6}" y="${y(v)+4}" text-anchor="end">${yfmt(v)}</text>`});
  xs.forEach((v,i)=>{g+=`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">${v}</text>`});
  g+=`<text class="ax" x="${ML+PW/2}" y="${H+8}" text-anchor="middle">${ylab}</text>`;
  let p="";series.forEach(s=>{let d;
    if(s.fn){ // a fitted curve: drawn from its formula at fine steps, not joined point to point
      const pts=[];const n0=xs.length-1;for(let k=0;k<=n0*20;k++){const i=k/20;pts.push((k?"L":"M")+x(i).toFixed(1)+" "+y(s.fn(xs[0]+i)).toFixed(1))}d=pts.join("");
    }else d=s.vals.map((v,i)=>v==null?null:[x(i),y(v)]).reduce((acc,pt)=>{if(!pt)return acc+"|";return acc+(acc===""||acc.endsWith("|")?"M":"L")+pt[0].toFixed(1)+" "+pt[1].toFixed(1)},"").replace(/\|/g,"");
    p+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.dash?1.6:2.2}" ${s.dash?'stroke-dasharray="6 4"':""} stroke-linejoin="round" stroke-linecap="round"/>`;
    s.vals.forEach((v,i)=>{if(v!=null&&!s.dash)p+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${sel===i?4.5:2.6}" fill="${s.color}" stroke="var(--panel)" stroke-width="1.5"/>`});
    const li=s.vals.length-1;if(!s.dash&&s.vals[li]!=null)p+=`<text x="${ML+PW+6}" y="${y(s.vals[li])+4}" class="ax" style="fill:var(--ink2);font-weight:700">${s.name}</text>`});
  // keep end labels from overlapping
  let xh="";if(sel!=null)xh=`<line class="xh" x1="${x(sel)}" x2="${x(sel)}" y1="${MT}" y2="${MT+PH}"/>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H+12}" role="img">${g}${p}${xh}<rect class="hit" x="${ML}" y="${MT}" width="${PW}" height="${PH}" fill="transparent"/></svg>`;
  el._geo={ML,PW,n:xs.length,step:true};
  const i=sel!=null?sel:xs.length-1;
  read.innerHTML=`<b>${xs[i]}年</b>　`+series.map(s=>`${s.name} <b>${s.vals[i]==null?"—":yfmt(s.vals[i],true)}</b>`).join("　");
}
function declutter(svgEl){
  // nudge right-edge labels apart (at least 12px)
  const t=[...svgEl.querySelectorAll('text[style*="font-weight:700"]')].map(e=>({e,y:+e.getAttribute("y")})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<t.length;i++)if(t[i].y-t[i-1].y<12){t[i].y=t[i-1].y+12;t[i].e.setAttribute("y",t[i].y)}
}
function renderHold(){
  const S=holdStats(state.hm);const xs=[...Array(10)].map((_,i)=>i+1);const sel=state.hi;
  const fitVals=S.fit?xs.map(n=>S.fit.f(n)):xs.map(()=>null);
  const ser=SYMS.map(([s,k])=>({name:s,color:C[k],vals:S[s].res.map(r=>r.m)})).concat([{name:"TQQQ近似",color:C.ink,vals:fitVals,dash:true,fn:S.fit?S.fit.f:null}]);
  lineChart($("hchart1"),$("hread1"),{xs,series:ser,yfmt:(v,full)=>full?mult(v):v+"倍",ylab:"保有年数",sel});
  declutter($("hchart1").querySelector("svg"));
  const ser2=SYMS.map(([s,k])=>({name:s,color:C[k],vals:S[s].res.map(r=>r.cagr)}));
  lineChart($("hchart2"),$("hread2"),{xs,series:ser2,yfmt:(v,full)=>full?pct(v):Math.round(v*100)+"%",ylab:"保有年数",sel});
  declutter($("hchart2").querySelector("svg"));
  const sw=k=>`<i style="background:${C[k]}"></i>`;
  $("hleg1").innerHTML=SYMS.map(([s,k])=>`<span>${sw(k)}${s}</span>`).join("")+(S.fit?`<span><i class="dash"></i>TQQQ近似 <span class="eq">y = ${S.fit.a.toFixed(4)}e<sup>${S.fit.b.toFixed(4)}x</sup>　R² = ${S.fit.r2.toFixed(4)}</span></span>`:"");
  $("hleg2").innerHTML=SYMS.map(([s,k])=>`<span>${sw(k)}${s}</span>`).join("");
  const lh=state.hm==="lh";
  $("hsub1").textContent=lh?"ある年の安値で買い、N年後の年の高値で売る":"ある年の年末に買い、N年後の年末に売る";
  $("hsub3").textContent="";
  $("htable1").innerHTML=`<thead><tr><th>年</th>${SYMS.map(([s])=>`<th>${s}</th>`).join("")}<th>近似</th></tr></thead><tbody>${xs.map((n,i)=>`<tr${sel===i?' class="hl"':""}><td class="k">${n}年</td>${SYMS.map(([s])=>{const r=S[s].res[i];return`<td>${r.m==null?"—":r.m.toFixed(2)}</td>`}).join("")}<td>${fitVals[i]==null?"—":fitVals[i].toFixed(2)}</td></tr>`).join("")}</tbody>`;
  $("htable2").innerHTML=`<thead><tr><th>年</th>${SYMS.map(([s])=>`<th>${s}</th>`).join("")}</tr></thead><tbody>${xs.map((n,i)=>`<tr${sel===i?' class="hl"':""}><td class="k">${n}年</td>${SYMS.map(([s])=>`<td>${pct(S[s].res[i].cagr)}</td>`).join("")}</tr>`).join("")}</tbody>`;
}

/* ---------- render ---------- */
function renderControls(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab===state.tab));
  document.querySelectorAll("#tf button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tf===state.tf));
  document.querySelectorAll("#scale button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sc===state.sc));
  document.querySelectorAll("#hmode button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.hm===state.hm));
  renderRangeButtons();
}
function renderTab(){
  ["chart","dist","hold"].forEach(t=>$("t-"+t).hidden=state.tab!==t);
  if(D)renderPeers();
  if(state.tab==="chart")renderCandles();else if(state.tab==="dist")renderDist();else renderHold();
}
function renderAll(){
  readColors();renderControls();
  if(!D)return;
  $("app").hidden=false;$("empty").hidden=true;
  renderStatus();renderPrice();renderTab();
}

/* ---------- load ---------- */
let loading=false;
// Live quotes from Finnhub (free key; it is visible in this page). They replace the latest
// prices and today's bar from the published data, so the refresh button gets the newest values.
const FINNHUB="dbb211pr01qrv06nsrngdbb211pr01qrv06nsro0";
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function etParts(t){
  const o={};new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",hourCycle:"h23"})
    .formatToParts(new Date(t*1000)).forEach(x=>{o[x.type]=+x.value});return o;
}
async function liveQuotes(d){
  const syms=["TQQQ","QQQ","QLD"],ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),6000);
  try{
    const qs=await Promise.all(syms.map(s=>fetch(`https://finnhub.io/api/v1/quote?symbol=${s}&token=${FINNHUB}`,{cache:"no-store",signal:ctl.signal}).then(r=>r.ok?r.json():null).catch(()=>null)));
    const Q={};let newest=0;
    qs.forEach((q,i)=>{
      if(!q||!(q.c>0)||!q.t)return;
      const e=etParts(q.t),n=e.year*10000+e.month*100+e.day,mins=e.hour*60+e.minute,date=`${MON[e.month-1]} ${e.day}, ${e.year}`;
      const open=mins>=570&&mins<960;
      Q[syms[i]]={q,n};newest=Math.max(newest,q.t);
      d.quotes=d.quotes||{};
      d.quotes[syms[i]]={price:q.c,prev:q.pc,high:q.h,low:q.l,
        time:open?`${date} ${(e.hour%12)||12}:${String(e.minute).padStart(2,"0")} ${e.hour<12?"AM":"PM"} ET`:`Closed at ${date}`};
    });
    const T=Q.TQQQ;
    if(T&&T.q.o>0){
      const last=d.daily[d.daily.length-1],q=T.q;
      const row=[T.n,q.o,Math.max(q.h,q.c),Math.min(q.l,q.c),q.c,q.c,Q.QQQ&&Q.QQQ.n===T.n?Q.QQQ.q.c:(T.n===last[0]?last[6]:null),Q.QLD&&Q.QLD.n===T.n?Q.QLD.q.c:(T.n===last[0]?last[7]:null)];
      if(T.n>last[0])d.daily.push(row);else if(T.n===last[0])d.daily[d.daily.length-1]=row;
    }
    if(newest){const iso=new Date(newest*1000).toISOString().replace(/\.\d+Z$/,"Z");if(!d.updatedAt||iso>d.updatedAt)d.updatedAt=iso}
  }finally{clearTimeout(to)}
}
async function load(manual){
  if(loading)return;loading=true;$("refresh").classList.add("spin");
  try{
    const r=await fetch("data/tqqq.json?ts="+Date.now(),{cache:"no-store"});
    if(r.status===404)throw new Error("nodata");
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();
    if(!d||!Array.isArray(d.daily)||!d.years)throw new Error("bad");
    try{await liveQuotes(d)}catch(e){}
    if(!D||d.updatedAt!==D.updatedAt||manual){setData(d);renderAll()}else renderStatus();
  }catch(e){
    if(!D){$("empty").innerHTML=e.message==="nodata"?"まだデータがありません。<br>GitHub の Actions で「Update TQQQ data」を一度実行すると表示されます。":"データを読み込めませんでした。通信状況を確認して、右上の↻で再読み込みしてください。";$("status").textContent="データなし"}
  }finally{loading=false;$("refresh").classList.remove("spin")}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){state.tab=b.dataset.tab;store.set("tab",state.tab);renderControls();renderTab();return}
  if(b.dataset.tf){state.tf=b.dataset.tf;store.set("tf",state.tf);state.ci=null;renderControls();renderCandles();return}
  if(b.dataset.sc){state.sc=b.dataset.sc;store.set("sc",state.sc);renderControls();renderCandles();return}
  if(b.dataset.rg){state.range[state.tf]=b.dataset.rg;store.set("r_"+state.tf,b.dataset.rg);state.ci=null;renderControls();renderCandles();return}
  if(b.dataset.hm){state.hm=b.dataset.hm;store.set("hm",state.hm);renderControls();renderHold();return}
  if(b.id==="refresh")load(true);
});
// scrub: candles, histogram and line charts all map the pointer to the nearest index
// Selecting a point: tap (or click) selects; sliding a finger sideways moves the selection;
// a vertical swipe scrolls the page and leaves the selection as it is.
function scrub(el,onIndex,onLeave){
  let t=null;
  const at=e=>{const g=el._geo,svg=el.querySelector("svg");if(!g||!svg)return;const r=svg.getBoundingClientRect();const sx=(e.clientX-r.left)*(svg.viewBox.baseVal.width/r.width);
    const f=(sx-g.ML)/g.PW;const i=g.step?Math.round(f*(g.n-1)):Math.floor(f*g.n);onIndex(Math.max(0,Math.min(g.n-1,i)))};
  el.addEventListener("pointerdown",e=>{if(e.target.closest(".hit"))t={x:e.clientX,y:e.clientY,id:e.pointerId,slide:false}});
  el.addEventListener("pointermove",e=>{
    if(e.pointerType==="mouse"&&!t){at(e);return}
    if(!t||e.pointerId!==t.id)return;
    const dx=e.clientX-t.x,dy=e.clientY-t.y;
    if(!t.slide&&Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy))t.slide=true;
    if(t.slide)at(e);
  });
  el.addEventListener("pointerup",e=>{
    if(t&&e.pointerId===t.id&&(t.slide||Math.hypot(e.clientX-t.x,e.clientY-t.y)<10))at(e);
    t=null;
  });
  el.addEventListener("pointercancel",()=>{t=null});
}
scrub($("cchart"),i=>{if(i!==state.ci){state.ci=i;renderCandles()}},()=>{state.ci=null;renderCandles()});
scrub($("dchart"),i=>{if(i!==state.di){state.di=i;renderDist()}},()=>{state.di=null;renderDist()});
scrub($("pchart"),i=>{if(i!==state.pi){state.pi=i;renderCandles()}},()=>{state.pi=null;renderCandles()});
scrub($("kchart"),i=>{if(i!==state.ki){state.ki=i;renderDist()}},()=>{state.ki=null;renderDist()});
scrub($("hchart1"),i=>{if(i!==state.hi){state.hi=i;renderHold()}},()=>{state.hi=null;renderHold()});
scrub($("hchart2"),i=>{if(i!==state.hi){state.hi=i;renderHold()}},()=>{state.hi=null;renderHold()});
// a tap outside the charts clears the selection (a swipe to scroll does not)
let tapOut=null;
document.addEventListener("pointerdown",e=>{tapOut=e.target.closest(".chart")?null:{x:e.clientX,y:e.clientY,id:e.pointerId}},true);
document.addEventListener("pointercancel",()=>{tapOut=null},true);
document.addEventListener("pointerup",e=>{
  const t=tapOut;tapOut=null;
  if(!t||e.pointerId!==t.id||Math.hypot(e.clientX-t.x,e.clientY-t.y)>=10)return;
  if(state.ci==null&&state.di==null&&state.hi==null&&state.ki==null&&state.pi==null)return;
  state.ci=state.di=state.hi=state.ki=state.pi=null;
  if(D)renderTab();
},true);
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{if(D)renderTab()},80)}).observe($("app"));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load(false)});
setInterval(()=>{if(document.visibilityState==="visible")load(false)},5*60*1000);
setInterval(()=>{if(D)renderStatus()},60*1000);
renderAll();load(false);
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
