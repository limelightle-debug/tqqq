name: Update TQQQ data

on:
  schedule:
    # US market hours in UTC (covers both daylight-saving and standard time), every 5 minutes, Mon-Fri (off the round minutes, when GitHub is less busy)
    - cron: "2-59/5 13-21 * * 1-5"
    # One more pass after the close, for late final prints
    - cron: "43 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update_tqqq.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: update TQQQ"
            git push
          fi
