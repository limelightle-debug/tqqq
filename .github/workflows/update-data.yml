name: Update TQQQ data

# One pass per run, started by the schedule below (no run keeps itself alive or starts the next one):
# every 15 minutes through the US session (summer and winter time both covered) and once after the close.
on:
  schedule:
    - cron: "*/15 13-20 * * 1-5"
    - cron: "43 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: One pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/update_tqqq.py || echo "update failed; trying again next time"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -q -m "data: update TQQQ"
            git pull -q --rebase origin main && git push -q || echo "push failed; trying again next time"
          fi
